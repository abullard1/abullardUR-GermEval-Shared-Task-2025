# Config that was used for the final VIO submission training run (Class Weights + Focal Loss Approach)
# These parameters reflect the best-performing run from the sweep.
# The model configuration aligns with the best sweep settings for this approach.

# Best hyperparameters from W&B Sweep (rich-sweep-1: F1-macro = 0.75054)
# Generated from sweep ID: 1adpvole

# Experiment Identity
experiment_type: "best"
model_family: "moderngbert"
model_checkpoint: "LSX-UniWue/ModernGBERT_134M"

# Dataset Configuration
dataset_details:
  hf_dataset_path_suffix: "vio/vio_hf_dataset_train"
  hf_dataset_tokenized_path_suffix: "vio/vio_hf_dataset_tokenized_train"
  label_column: "VIO"

# W&B Configuration
wandb_run_name_parts:
  model_arch: "moderngbert"

wandb_tags_add:
  - "moderngbert"
  - "best_hyperparams"
  - "focal_loss"
  - "sweep_optimized"

wandb_notes: "Final training run with best hyperparameters from VIO sweep. Class Weights + Focal Loss Approach."

# Model Configuration
model_config:
  num_labels: 2
  id2label: {0: "False", 1: "True"}
  label2id: {"False": 0, "True": 1}
  trust_remote_code: true

# Focal Loss Configuration
gamma: 0.5191325114827803

# Training arguments
training_arguments:
  learning_rate: !!float 3e-5
  num_train_epochs: 3
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 32
  warmup_steps: 100
  weight_decay: 0.08113106416454527