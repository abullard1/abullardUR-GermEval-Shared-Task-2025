# Experiment: ModernGBERT Baseline for Violence Detection

# Experiment Identity
experiment_type: "baseline"
model_family: "moderngbert"
model_checkpoint: "LSX-UniWue/ModernGBERT_134M"

# W&B Configuration
wandb_run_name_parts:
  model_arch: "moderngbert"

wandb_tags_add:
  - "moderngbert"
  - "baseline_run"

wandb_notes: "Baseline run for ModernGBERT on Violence Detection (trial data)."

# Model Configuration
model_config:
  num_labels: 2
  id2label: {0: "False", 1: "True"}
  label2id: {"False": 0, "True": 1}
  trust_remote_code: true

# Training Arguments Override
training_arguments:
  learning_rate: 2.0e-5
  warmup_steps: 100
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 4
  num_train_epochs: 3


