# Experiment: ModernGBERT Baseline for Attacks on DBO (Training Data)

# Experiment Identity
experiment_type: "baseline"
model_family: "moderngbert"
model_checkpoint: "LSX-UniWue/ModernGBERT_134M"

# Dataset Configuration (training dataset)
dataset_details:
  hf_dataset_path_suffix: "dbo/dbo_hf_dataset_train"
  hf_dataset_tokenized_path_suffix: "dbo/dbo_hf_dataset_tokenized_train"
  label_column: "DBO"

# W&B Configuration
wandb_run_name_parts:
  model_arch: "moderngbert"

wandb_tags_add:
  - "moderngbert"
  - "baseline_run"

wandb_notes: "Baseline run for ModernGBERT on Attacks on DBO (training data)."

# Model Configuration
model_config:
  num_labels: 4
  id2label: {0: "nothing", 1: "criticism", 2: "agitation", 3: "subversive"}
  label2id: {"nothing": 0, "criticism": 1, "agitation": 2, "subversive": 3}
  trust_remote_code: true

# Training Arguments Override (fixed baseline hyperparameters)
training_arguments:
  learning_rate: 2.0e-5
  warmup_steps: 500
  weight_decay: 0.01
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 16
  num_train_epochs: 50


